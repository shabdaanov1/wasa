services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: wasa-photos-backend:local
    ports:
      - "3000:3000"
    volumes:
      - ./backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: wasa-photos-frontend:local
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped


    